apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-inference-api
  namespace: mlops-platform
  labels:
    app: mlops-inference-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-inference-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mlops-inference-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: wait-for-postgres
          image: cloud-native-ai-mlops:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mlops-postgres-secret
                  key: DATABASE_URL
          command:
            - python
            - -c
            - |
              import os
              import time
              from app.db import DatabaseManager

              db = DatabaseManager(os.environ["DATABASE_URL"])
              for _ in range(30):
                  try:
                      if db.ping():
                          db.init_tables()
                          print("PostgreSQL ready and schema initialized")
                          break
                  except Exception as exc:
                      print("Waiting for PostgreSQL:", exc)
                  time.sleep(2)
              else:
                  raise SystemExit("PostgreSQL did not become ready in time")
      containers:
        - name: api
          image: cloud-native-ai-mlops:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: mlops-inference-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mlops-postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "160Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
