apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-inference-api
  namespace: mlops-platform
  labels:
    app: mlops-inference-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-inference-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mlops-inference-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: cloud-native-ai-mlops:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODEL_PATH
              value: "artifacts/model_int8.onnx"
            - name: TOKENIZER_PATH
              value: "artifacts/tokenizer.json"
            - name: BASELINE_STATS_PATH
              value: "artifacts/baseline_stats.json"
            - name: DATABASE_URL
              value: "sqlite:////tmp/predictions.db"
          resources:
            requests:
              cpu: "100m"
              memory: "160Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
