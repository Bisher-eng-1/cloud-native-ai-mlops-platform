[project]
name = "cloud-native-ai-mlops-platform"
version = "1.0.0"
description = "Cloud-Native ONNX Transformer inference service with MLflow tracking, PSI drift monitoring, Neon PostgreSQL logging, Kubernetes kind CI, and Terraform IaC."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:mlflow.*",
    "ignore::torch.jit.TracerWarning",
]
