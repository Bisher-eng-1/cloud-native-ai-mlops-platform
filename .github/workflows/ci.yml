name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  mlops-test-and-onnx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch and MLOps dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-mlops.txt

      - name: Lint Python codebase with Ruff
        run: ruff check .

      - name: Run Transformer ONNX export, INT8 quantization & MLflow check
        run: python -m mlops.train_export --epochs 8

      - name: Run pytest with coverage
        run: pytest -v --cov=app --cov=mlops --cov-report=term-missing --cov-fail-under=85

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format & Validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  docker-and-kind-k8s:
    runs-on: ubuntu-latest
    needs: [mlops-test-and-onnx, terraform-validate]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build lean ONNX serving Docker image
        run: docker build -t cloud-native-ai-mlops:local .

      - name: Create kind Kubernetes cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: mlops-ci

      - name: Load image into kind & deploy manifests
        run: |
          kind load docker-image cloud-native-ai-mlops:local --name mlops-ci
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl -n mlops-platform rollout status deployment/mlops-postgres --timeout=120s
          kubectl -n mlops-platform rollout status deployment/mlops-inference-api --timeout=120s
          kubectl -n mlops-platform get pods,svc,hpa

      - name: Smoke-test FastAPI + ONNX + PostgreSQL + Metrics inside Kubernetes
        run: |
          kubectl -n mlops-platform port-forward svc/mlops-inference-service 8000:80 &
          PF_PID=$!
          trap "kill ${PF_PID} >/dev/null 2>&1 || true" EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python3 scripts/smoke_demo.py --base-url http://127.0.0.1:8000 --expect-backend postgresql

      - name: Log in and push image to GHCR (on main push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tagged container image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/cloud-native-ai-mlops-platform"
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag cloud-native-ai-mlops:local "${IMAGE_LOWER}:latest"
          docker push "${IMAGE_LOWER}:latest"
